# SwiftLint 設定ファイル（Anti-Gravity 開発方針・静的解析ルール）
included:
  - TrafficAccidentCheck
  - TrafficAccidentCheckTests

excluded:
  - build
  - DerivedData

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - i
